app = "nectar-sql-demo"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "5s"
    interval     = "15s"
    method       = "GET"
    path         = "/health"
    timeout      = "5s"
    protocol     = "http"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
