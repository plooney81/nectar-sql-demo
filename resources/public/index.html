<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nectar-sql</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" integrity="sha512-uf06llspW44/LZpHzHT6qBOIVODjWtv4MxCricRxkzvopAlSWnTf6hpZTFxuuZcuNE9CBQhqE0Seu1CoRk84nQ==" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" integrity="sha512-2OhXH4Il3n2tHKwLLSDPhrkgnLBC+6lHGGQzSFi3chgVB6DJ/v6+nbx+XYO9CugQyHVF/8D/0k3Hx1eaUK2K9g==" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a class="logo" href="https://github.com/plooney81/nectar-sql" target="_blank" rel="noopener noreferrer">
      <span class="logo-icon">🍯</span>
      <span class="logo-text">nectar-sql</span>
    </a>
    <p class="tagline">Converts raw SQL into <a href="https://github.com/seancorfield/honeysql" target="_blank" rel="noopener noreferrer">HoneySQL</a> · <a href="https://github.com/plooney81/nectar-sql" target="_blank" rel="noopener noreferrer">nectar-sql</a> <span id="lib-version"></span></p>
    <a class="github-link" href="https://github.com/plooney81/nectar-sql" target="_blank" rel="noopener noreferrer" title="View on GitHub">
      <svg height="20" viewBox="0 0 16 16" width="20" aria-hidden="true">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
          -.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2
          -3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65
          7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56
          .82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2
          0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>GitHub</span>
    </a>
  </header>

  <main>
    <div class="toolbar">
      <div class="toolbar-left">
        <label for="examples" class="sr-only">Load example</label>
        <select id="examples">
          <option value="">Load an example…</option>
          <option value="simple-select">Simple SELECT</option>
          <option value="select-join">SELECT with JOIN</option>
          <option value="select-aggregate">SELECT with aggregate</option>
          <option value="insert">INSERT</option>
        </select>
      </div>
      <div class="toolbar-right">
        <span class="hint">Supports SELECT and INSERT queries</span>
        <button id="convert-btn">Convert <kbd>⌘↵</kbd></button>
      </div>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-header">
          <span>SQL</span>
        </div>
        <div id="sql-editor"></div>
      </div>

      <div class="divider"></div>

      <div class="pane">
        <div class="pane-header">
          <span>HoneySQL</span>
          <button id="copy-btn" class="copy-btn" title="Copy to clipboard">Copy</button>
        </div>
        <div id="honeysql-editor"></div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" integrity="sha512-OeZ4Yrb/W7d2W4rAMOO0HQ9Ro/aWLtpW9BUSR2UOWnSV2hprXLkkYnnCGc9NeLUxxE4ZG7zN16UuT1Elqq8Opg==" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js" integrity="sha512-TZji/E4or1ciET62zt9IgnfFJPkMqV4EhZ8AfiRVZeq+yxCT5O+PomM7nkfttOwX/ckDwjPzevAUhKvXnHl7MA==" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clojure/clojure.min.js" integrity="sha512-11bCi6z5ZAiuzJK1+w20ucw1iea2cXkMF2E6oTyIPYTne3dn9f1MTE/UiLY4b49vNDDZysAXYncxu/KJrHQXuA==" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
